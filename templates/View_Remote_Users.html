{% extends 'base.html' %}
{% block content %}

<div class="card">
    <h3 class="title">All Users</h3>

    <table class="table table-striped table-custom">
        <thead class="table-dark">
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Country</th>
                <th>State</th>
                <th>City</th>
            </tr>
        </thead>

        <tbody>
            {% for o in objects %}
            <tr>
                <td>{{ o.username }}</td>
                <td>{{ o.email }}</td>
                <td>{{ o.phoneno }}</td>
                <td>{{ o.country }}</td>
                <td>{{ o.state }}</td>
                <td>{{ o.city }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
