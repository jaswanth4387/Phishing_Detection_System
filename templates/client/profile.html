{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">PhishGuard</span>

            <div>
                <a class="text-info me-3 fw-bold" href="{% url 'profile' %}">Profile</a>
                <a class="text-white me-3" href="{% url 'predict' %}">Predict</a>
                <a class="text-white" href="{% url 'home' %}">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Profile Card -->
    <div class="container mt-5">
        <div class="profile-card">

            <h3 class="text-center mb-4">User Profile</h3>

            <p><b>First Name:</b> {{ user.first_name }}</p>
            <p><b>Last Name:</b> {{ user.last_name }}</p>
            <p><b>Username:</b> {{ user.username }}</p>
            <p><b>Email:</b> {{ user.email }}</p>

        </div>
    </div>

</body>

</html>
