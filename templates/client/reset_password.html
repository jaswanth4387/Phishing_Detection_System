<!DOCTYPE html>
<html>
<head>
    <title>New Password</title>
</head>

<body class="login-container">

<div class="login-card">

    <h3 class="text-center">Set New Password</h3>

    <form method="POST">
        {% csrf_token %}

        <input type="password" name="password" class="form-control mb-3" placeholder="New Password">

        <button class="btn btn-login w-100">Update Password</button>

    </form>

</div>

</body>
</html>
