{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Predict URL</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/predict.css' %}">
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">PhishGuard</span>

        <div>
            <a class="text-white me-3" href="{% url 'profile' %}">Profile</a>

            <!-- Active -->
            <a class="text-info me-3 fw-bold" href="{% url 'predict' %}">Predict</a>

            <a class="text-white" href="{% url 'home' %}">Logout</a>
        </div>
    </div>
</nav>

<!-- 🔹 MAIN SECTION -->
<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="predict-card text-center">

        <h2 class="mb-4">🔍 URL Safety Check</h2>

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}

            <input type="text" name="url" class="form-control mb-3"
                   placeholder="Enter URL (https://example.com)" required>

            <button class="btn btn-predict w-100">Predict</button>
        </form>

        <!-- Output -->
        {% if objs %}
        <div class="result-box mt-4">

            <h5>Result:</h5>

            {% if "Phishing" in objs %}
                <p class="text-danger fw-bold">{{ objs }}</p>
            {% else %}
                <p class="text-success fw-bold">{{ objs }}</p>
            {% endif %}

        </div>
        {% endif %}

    </div>

</div>

</body>
</html>
