{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | PhishGuard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="register-card">

        <h2 class="text-center mb-4">🔐 Create Account</h2>

        <form method="POST" onsubmit="return validateForm()">
            {% csrf_token %}

            <div class="row">

                <!-- First Name -->
                <div class="col-md-6 mb-3">
                    <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
                </div>

                <!-- Last Name -->
                <div class="col-md-6 mb-3">
                    <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
                </div>

                <!-- Username -->
                <div class="col-md-6 mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>

                <!-- Mobile -->
                <div class="col-md-6 mb-3">
                    <div class="otp-box">
                        <input type="text" name="mobile" class="form-control" placeholder="Mobile Number" required>
                        <button type="button" class="otp-btn">Send OTP</button>
                    </div>
                </div>

                <!-- Email -->
                <div class="col-md-6 mb-3">
                    <div class="otp-box">
                        <input type="email" name="email" class="form-control" placeholder="Email" required>
                        <button type="button" class="otp-btn">Verify</button>
                    </div>
                </div>

                <!-- Password -->
                <div class="col-md-6 mb-3">
                    <div class="password-box">
                        <input type="password" name="password" id="password" placeholder="Password" required>
                        <span onclick="togglePassword('password', this)">👁️</span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="col-md-6 mb-3">
                    <div class="password-box">
                        <input type="password" id="confirm_password" placeholder="Confirm Password" required>
                        <span onclick="togglePassword('confirm_password', this)">👁️</span>
                    </div>
                </div>

            </div>

            <button class="btn btn-register w-100 mt-2">Register</button>

        </form>

        <div class="text-center mt-3">
            <span>Already have an account? </span>
            <a href="{% url 'login' %}" class="link">Login</a>
        </div>

    </div>

</div>

<script src="{% static 'js/register.js' %}"></script>

</body>
</html>
