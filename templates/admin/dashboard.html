{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | PhishGuard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand fw-bold">🔐 PhishGuard Admin</span>

        <div>
            <a class="nav-link-custom active" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link-custom" href="{% url 'view_users' %}">Users</a>
            <a class="nav-link-custom" href="{% url 'view_predictions' %}">Predictions</a>
            <a class="nav-link-custom" href="{% url 'home' %}">Logout</a>
        </div>
    </div>
</nav>

<!-- 🔹 MAIN -->
<div class="container mt-5">

    <h2 class="text-center mb-5">📊 Dashboard Overview</h2>

    <!-- 🔹 CARDS -->
    <div class="row text-center">

        <div class="col-md-4 mb-4">
            <div class="card-box hover-glow">
                <h5>Total Users</h5>
                <p>{{ total_users }}</p>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card-box hover-glow">
                <h5>Total Predictions</h5>
                <p>{{ total_predictions }}</p>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card-box hover-glow">
                <h5>Phishing Ratio</h5>
                <p>{{ phishing_ratio }}%</p>
            </div>
        </div>

    </div>

    <!-- 🔹 ACTION BUTTONS -->
    <div class="text-center mb-5">
        <a href="{% url 'train_model' %}" class="btn btn-custom m-2">⚙ Train Model</a>
        <a href="{% url 'view_users' %}" class="btn btn-custom m-2">👥 Users</a>
        <a href="{% url 'view_predictions' %}" class="btn btn-custom m-2">📋 Predictions</a>
    </div>

    <!-- 🔹 CHART -->
    <div class="chart-container">
        <h4 class="text-center mb-3">Phishing vs Safe Analysis</h4>
        <canvas id="chart"></canvas>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS -->
<script>
    window.phishing_count = parseInt("{{ phishing_count|default:0 }}");
    window.safe_count = parseInt("{{ safe_count|default:0 }}");
</script>
<script src="{% static 'js/dashboard.js' %}"></script>

</body>
</html>
